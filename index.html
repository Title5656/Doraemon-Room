<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้องของ Title | 3D Portfolio</title>
<meta name="description" content="ห้อง 3D ของ Title นักศึกษา ICT สาขา DST มหาวิทยาลัยมหิดล ลองเปิดลิ้นชักดูโปรเจกต์กัน">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1ea0f0;--blue-d:#0b6fb8;--red:#e8382f;--yellow:#ffd21f;--ink:#1d2b3a;--paper:#fffdf6;--muted:#5d6b7a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Mali',sans-serif;color:var(--ink);background:#cfeaff}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3db5ff,#0a6fc2);transition:opacity .8s,visibility .8s}
  #intro.hide{opacity:0;visibility:hidden}
  .intro-card{text-align:center;color:#fff;padding:30px;max-width:540px}
  .pocket{width:150px;height:75px;margin:0 auto 22px;background:#fff;border:4px solid var(--ink);border-top:none;border-radius:0 0 80px 80px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
  .intro-card h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;margin:6px 0 14px;text-shadow:3px 3px 0 var(--ink)}
  .intro-card h1 span{color:var(--yellow)}
  .intro-card p{opacity:.95;line-height:1.7}
  #enterBtn{margin-top:26px;font-family:inherit;font-size:1.15rem;font-weight:700;padding:14px 34px;border-radius:999px;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:.15s}
  #enterBtn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
  .hud-top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
  .brand{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:center;gap:10px}
  .bell{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink)}
  .hud-btns{display:flex;gap:10px;pointer-events:auto}
  .round-btn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-size:1.2rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.15s}
  .round-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:5;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px;box-shadow:4px 4px 0 var(--ink);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
  .dock button{border:none;background:transparent;font-family:inherit;font-size:.88rem;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--ink);transition:.15s}
  .dock button:hover,.dock button.active{background:var(--blue);color:#fff}
  .hint{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(29,43,58,.85);color:#fff;padding:8px 18px;border-radius:999px;font-size:.85rem;white-space:nowrap;transition:opacity .6s}
  .hint.hide{opacity:0}
  #tooltip{position:fixed;pointer-events:none;z-index:6;background:var(--ink);color:#fff;padding:6px 12px;border-radius:10px;font-size:.85rem;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
  #tooltip.show{opacity:1;transform:none}
  #toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-20px);z-index:15;background:var(--yellow);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.35s;pointer-events:none;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);z-index:8;background:var(--paper);border-left:4px solid var(--ink);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column}
  #panel.open{transform:none}
  .panel-head{background:var(--blue);color:#fff;padding:22px 60px 18px 24px;border-bottom:4px solid var(--ink);position:relative}
  .panel-head::after{content:'';position:absolute;left:0;right:0;bottom:-16px;height:12px;background:var(--red);border-bottom:3px solid var(--ink)}
  .panel-head .bell{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);width:32px;height:32px;border:3px solid var(--ink);z-index:2}
  .panel-head small{letter-spacing:3px;opacity:.85;font-weight:600}
  .panel-head h2{font-size:1.6rem;margin-top:2px}
  .close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  .panel-body{padding:46px 24px 30px;overflow-y:auto;flex:1;line-height:1.7}
  .panel-body h3{font-size:1.25rem}
  .panel-body h4{margin:18px 0 8px;color:var(--blue-d)}
  .panel-body p{margin-bottom:12px}
  .muted{color:var(--muted);font-size:.92rem}
  .profile{display:flex;gap:16px;align-items:center;margin-bottom:16px}
  .avatar{width:96px;height:96px;overflow:hidden;position:relative;border-radius:50%;background:var(--blue);border:3px solid var(--ink);display:grid;place-items:center;font-size:2.2rem;flex-shrink:0}
  .avatar img{position:absolute;width:160%;max-width:none;height:auto;left:-30%;top:-5%;image-rendering:pixelated}
  .links a{overflow-wrap:anywhere;min-width:0}
  .profile>div:last-child{min-width:0}
  .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
  .facts div{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center;box-shadow:3px 3px 0 var(--ink)}
  .facts b{display:block;font-size:1.5rem;color:var(--red)}
  .facts span{font-size:.8rem}
  .skill{margin-bottom:12px}
  .skill .row{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem}
  .bar{height:12px;background:#e7eef5;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#5fd0ff);transition:width 1.2s cubic-bezier(.2,.9,.2,1)}
  .tl-item{position:relative;padding-left:26px;margin-bottom:18px;border-left:3px dashed var(--blue)}
  .tl-item::before{content:'';position:absolute;left:-10px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink)}
  .year{font-weight:700;color:var(--red);font-size:.9rem}
  .card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);margin-top:6px}
  .card h4{margin:0 0 4px;color:var(--ink)}
  .card p{font-size:.92rem;color:var(--muted);margin-bottom:6px}
  .card a{color:var(--blue-d);font-weight:700;text-decoration:none;font-size:.9rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chips span{font-size:.75rem;padding:2px 10px;border-radius:999px;background:#e3f4ff;border:2px solid var(--blue);color:var(--blue-d);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gadget{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center;box-shadow:3px 3px 0 var(--ink);transition:.2s}
  .gadget:hover{transform:translateY(-4px) rotate(-1deg)}
  .gadget .ico{font-size:1.8rem}
  .gadget b{display:block}
  .gadget span{font-size:.8rem;color:var(--muted)}
  .btn{display:inline-block;margin-top:8px;padding:10px 22px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;text-decoration:none;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:inherit;font-size:1rem;cursor:pointer}
  .links{display:flex;flex-direction:column;gap:10px;margin:12px 0 20px}
  .links a{display:flex;gap:10px;align-items:center;padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;box-shadow:3px 3px 0 var(--ink);transition:.15s}
  .links a:hover{background:var(--yellow)}
  @media(max-width:600px){.brand{font-size:.85rem;padding:6px 14px}.hint{font-size:.72rem;bottom:80px}}
</style>
</head>

/* =====================================================

const tl = (y, t, d, tags = [], link) => `<div class="tl-item"><span class="year">${y}</span><div class="card"><h4>${t}</h4><p>${d}</p>

const SECTIONS = {

  projects: { tag: 'TIME MACHINE', title: '⏳ โปรเจกต์ที่ลองทำ', html: `

    ${tl('2026', '🌱 Study Garden', 'เว็บไว้อ่านเตรียมสอบ มีสรุป แฟลชการ์ด แล้วก็ Quiz', ['HTML', 'CSS', 'JavaScript'], 'https://github.com/Title5656/study-garden')}

  goals: { tag: 'DREAMS', title: '🪟 ความฝันและเป้าหมาย', html: `
    <p>มองออกไปนอกหน้าต่าง แล้วคิดไว้ว่า...</p>

/* =====================================================
   2) ฉาก / กล้อง / แสง
===================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const DAY_BG = 0xcfeaff, NIGHT_BG = 0x0d1330;
scene.background = new THREE.Color(DAY_BG);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(-10, 9, 12);
let shift = 0, shiftT = 0;                       // เลื่อนภาพหลบ panel
const applyView = () => camera.setViewOffset(innerWidth, innerHeight, shift, 0, innerWidth, innerHeight);
applyView();

const controls = new OrbitControls(camera, canvas);
controls.target.set(0.2, 0.8, -0.2);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.4;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.enabled = false;

const hemi = new THREE.HemisphereLight(0xffffff, 0xd9cfae, 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(2, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ---------- Helpers ---------- */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
const add = (m, x, y, z, p) => { m.position.set(x, y, z); p.add(m); return m; };
const box  = (w, h, d, m, x = 0, y = 0, z = 0, p = scene) => add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), x, y, z, p);
const rbox = (w, h, d, m, x = 0, y = 0, z = 0, p = scene, r = .02) => add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), m), x, y, z, p);

function unit(pos, rotY, normal) {
  const g = new THREE.Group(); g.position.set(...pos); g.rotation.y = rotY; scene.add(g);

function buildWall(u, len, hole, pillars = []) {
  const g = u.g, L = len / 2;
  const pane = (x0, x1, y0, y1) => {
    if (x1 - x0 < 1e-3 || y1 - y0 < 1e-3) return;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), wallMat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); g.add(m);
  };
  if (!hole) pane(-L, L, 0, H);
  else { const [a, b, c, d] = hole; pane(-L, a, 0, H); pane(c, L, 0, H); pane(a, c, d, H); pane(a, c, 0, b); }
  const t = (w, h, dd, x, y) => box(w, h, dd, pillarMat, x, y, dd / 2, g);
  [-L + .05, L - .05, ...pillars].forEach(x => t(.1, H, .05, x, H / 2));   // เสา
  t(len, .1, .06, 0, NAGE);                                                // คานนาเงชิ
  t(len, .05, .04, 0, H - .025);                                           // บัวเพดาน
  if (hole && hole[1] === 0) { t(hole[0] + L, .06, .02, (-L + hole[0]) / 2, .03); t(L - hole[2], .06, .02, (hole[2] + L) / 2, .03); }
  else t(len, .06, .02, 0, .03);                                           // บัวพื้น
}

const anims = [];

const ITEMS = {
  about:      { label: '🛏️ ตู้นอนชั้นบน — About Me',         anim: closetAnim, view: [[.15, 1.45, .15], [2.2, 1.0, -.7]] },
  tools:      { label: '📦 ตู้ชั้นล่าง — อุปกรณ์วิเศษ',          anim: closetAnim, view: [[.2, .95, .35], [2.2, .35, -.7]] },
  projects:   { label: '⏳ ลิ้นชักไทม์แมชชีน — Projects',      anim: tmAnim,     view: [[.06, 1.35, .3], [.06, .6, -.65]] },
  experience: { label: '📄 ลิ้นชักช่องบน — Resume',          anim: d1Anim,     view: [[.75, 1.25, .25], [.59, .5, -.6]] },
  awards:     { label: '🏅 ลิ้นชักช่องกลาง — รางวัล',          anim: d2Anim,     view: [[.8, 1.05, .25], [.59, .3, -.6]] },
  secret:     { label: '❓ ลิ้นชักช่องล่าง — มีอะไรอยู่นะ?',     anim: d3Anim },
  skills:     { label: '📚 ชั้นหนังสือ — Skills',                                view: [[.4, 1.35, .35], [-1.6, 1.05, -.2]] },
  education:  { label: '🎒 กระเป๋านักเรียน — การศึกษา',                         view: [[-.6, .95, .2], [-1.15, .4, -1.0]] },
  goals:      { label: '🪟 หน้าต่าง — ความฝัน',                                  view: [[.25, 1.35, .6], [.25, 1.3, -1.4]] },
  hobbies:    { label: '🍩 โต๊ะญี่ปุ่น — Hobbies',                               view: [[1.1, 1.1, 1.3], [.35, .3, .45]] },
  contact:    { label: '🚪 ประตูไปที่ไหนก็ได้ — Contact',    anim: doorAnim,   view: [[-.56, 1.25, 2.42], [-1.1, 1.0, .92]] },
  lamp:       { label: '💡 โคมไฟโต๊ะ — เปิด/ปิด' },
  ceiling:    { label: '🔆 ไฟเพดาน — ดึงเชือกเปิด/ปิด' },
};
const DOCK = [['about', '🛏️ About'], ['skills', '📚 Skills'], ['projects', '⏳ Projects'], ['experience', '📄 Resume'],
  ['awards', '🏅 Awards'], ['tools', '📦 Tools'], ['education', '🎒 Education'], ['hobbies', '🍩 Hobbies'],
  ['goals', '🪟 Dreams'], ['contact', '🚪 Contact']];
const rootKey = id => (id === 'about' || id === 'tools') ? 'closet' : id;

/* =====================================================
   6) UI / กล้อง / คลิก
===================================================== */
const $ = id => document.getElementById(id);
const panel = $('panel'), panelBody = $('panelBody'), tooltip = $('tooltip'), toastEl = $('toast'), hint = $('hint'), dock = $('dock');

DOCK.forEach(([id, label]) => {
  const b = document.createElement('button'); b.textContent = label; b.dataset.id = id;
  b.onclick = () => activate(id); dock.appendChild(b);
});
const updateDock = () => dock.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === current));

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

let tween = null;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function flyTo(pos, target, dur = 1.3) {
  tween = { fp: camera.position.clone(), tp: new THREE.Vector3(...pos), ft: controls.target.clone(), tt: new THREE.Vector3(...target), t: 0, dur };
  controls.enabled = false;
}
function defaultView() {
  const k = innerWidth / innerHeight < 1 ? 1.6 : 1;
  return [[-4.2 * k, 4.0 * k, 5.0 * k], [.2, .8, -.2]];
}

let lampOn = false, roomOn = false;
function setLamp(on) { lampOn = on; lampLight.intensity = on ? 1.2 : 0; bulb.material.emissiveIntensity = on ? 3 : .1; }
function setRoom(on) { roomOn = on; roomLight.intensity = on ? 6 : 0; shade.material.emissiveIntensity = on ? 1.2 : .05; }

let current = null;
function activate(id) {
  const it = ITEMS[id]; if (!it) return;
  hint.classList.add('hide');
  if (id === 'lamp') return setLamp(!lampOn);
  if (id === 'ceiling') return setRoom(!roomOn);
  if (id === 'secret') {
    it.anim.target = it.anim.target ? 0 : 1;
    if (it.anim.target) toast('รวยไม่ไหวแล้วโว๊ย');
    return;
  }
  if (current === id) return closePanel();
  if (current && ITEMS[current].anim) ITEMS[current].anim.target = 0;
  current = id;
  if (it.anim) it.anim.target = 1;
  flyTo(...it.view);
  openPanel(id);
  updateDock();
}
function openPanel(id) {
  const s = SECTIONS[id];
  $('panelTag').textContent = s.tag; $('panelTitle').textContent = s.title;
  panelBody.innerHTML = s.html; panelBody.scrollTop = 0;
  panel.classList.add('open');
  shiftT = innerWidth > 820 ? 220 : 0;
  setTimeout(() => panelBody.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w), 300);
}
function closePanel() {
  if (current && ITEMS[current].anim) ITEMS[current].anim.target = 0;
  current = null; shiftT = 0;
  panel.classList.remove('open');
  flyTo(...defaultView());
  updateDock();
}
$('closeBtn').onclick = closePanel;
$('homeBtn').onclick = () => current ? closePanel() : flyTo(...defaultView());
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// กลางวัน / กลางคืน (แก้บั๊กหน้าต่าง: อ้าง winGlass.material ตัวที่ใช้งานจริง)
let night = false;
$('nightBtn').onclick = () => {
  night = !night;
  winGlass.material.map = night ? skyNight : skyDay;
  winGlass.material.needsUpdate = true;
  hemi.intensity = night ? .3 : 1.5;
  sun.intensity = night ? .15 : 2.2;
  sun.color.set(night ? 0x8899ff : 0xfff1d6);
  scene.background.set(night ? NIGHT_BG : DAY_BG);
  $('nightBtn').textContent = night ? '☀️' : '🌙';
  setRoom(night); setLamp(night);
};

// Raycast (ข้ามผนังที่ถูกซ่อน)
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
const visibleDeep = o => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function pick(e) {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  for (const h of raycaster.intersectObjects(scene.children, true)) {
    if (h.object.isSprite || !visibleDeep(h.object)) continue;
    let o = h.object;
    while (o) {
      if (o.userData.id) return o.userData.id === 'closet' ? (h.point.y > .82 ? 'about' : 'tools') : o.userData.id;
      o = o.parent;
    }
    return null;
  }
  return null;
}
function highlight(id, on) {
  (roots[rootKey(id)] || []).forEach(r => r.traverse(o => {
    if (o.isMesh && o.material.emissive && !o.userData.glow) o.material.emissive.setHex(on ? 0x3a2a10 : 0);
  }));
}
let hovered = null;
canvas.addEventListener('pointermove', e => {
  const id = pick(e);
  if (id !== hovered) { if (hovered) highlight(hovered, false); hovered = id; if (id) highlight(id, true); }
  canvas.style.cursor = id ? 'pointer' : 'grab';
  if (id) {
    tooltip.textContent = ITEMS[id].label;
    tooltip.style.left = e.clientX + 16 + 'px'; tooltip.style.top = e.clientY + 16 + 'px';
    tooltip.classList.add('show');
  } else tooltip.classList.remove('show');
});
let down = null;
canvas.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); down = null;
  if (moved < 6) { const id = pick(e); if (id) activate(id); }
});

$('enterBtn').onclick = () => {
  $('intro').classList.add('hide');
  flyTo(...defaultView(), 2.2);
  setTimeout(() => hint.classList.add('hide'), 9000);
};
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); applyView(); });

/* =====================================================
   7) Loop
===================================================== */
const clock = new THREE.Clock(), tmpV = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // ซ่อนผนังที่อยู่ระหว่างกล้องกับห้อง
  units.forEach(u => {
    const vis = tmpV.copy(camera.position).sub(u.p).dot(u.n) > 0;
    u.g.visible = vis; u.extra.forEach(o => o.visible = vis);
  });

  anims.forEach(a => { a.p += (a.target - a.p) * Math.min(1, dt * 6); a.apply(a.p); });
  tmSwirl.rotation.z -= dt * 1.6;
  copterBlade.rotation.y += dt * (1 + d3Anim.p * 25);
  stars.forEach((s, i) => {
    const k = .1 + Math.sin(t * 3 + i) * .025;
    s.scale.set(k, k, k); s.position.y = s.userData.y + Math.sin(t * 2 + i) * .03;
  });

  if (Math.abs(shiftT - shift) > .5) { shift += (shiftT - shift) * Math.min(1, dt * 5); applyView(); }

  if (tween) {
    tween.t += dt / tween.dur;
    const k = ease(Math.min(tween.t, 1));
    camera.position.lerpVectors(tween.fp, tween.tp, k);
    controls.target.lerpVectors(tween.ft, tween.tt, k);
    camera.lookAt(controls.target);
    if (tween.t >= 1) { tween = null; controls.enabled = true; }
  } else controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
